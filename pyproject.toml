[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "too-many-arguments",
    "too-many-instance-attributes"
]
